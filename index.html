<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Instagram Carousel Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
        }
        .carousel-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 1rem;
            padding-bottom: 1rem;
        }
        .carousel-slide {
            scroll-snap-align: start;
            flex: 0 0 auto;
            width: 300px;
            height: 533px; /* 9:16 aspect ratio */
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background-color: #e5e7eb;
            position: relative;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Custom Scrollbar */
        .carousel-container::-webkit-scrollbar {
            height: 8px;
        }
        .carousel-container::-webkit-scrollbar-track {
            background: #e5e7eb;
            border-radius: 4px;
        }
        .carousel-container::-webkit-scrollbar-thumb {
            background: #9ca3af;
            border-radius: 4px;
        }
        .carousel-container::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [topic, setTopic] = useState('');
            const [numSlides, setNumSlides] = useState(4);
            const [platform, setPlatform] = useState('Instagram');
            const [aspectRatio, setAspectRatio] = useState('9:16');
            const [loading, setLoading] = useState(false);
            const [status, setStatus] = useState('');
            const [generatedData, setGeneratedData] = useState(null);
            const [copied, setCopied] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [slideLoading, setSlideLoading] = useState({});
            const [isDownloadingAll, setIsDownloadingAll] = useState(false);

            // Helper for exponential backoff fetch
            const fetchWithRetry = async (url, options, maxRetries = 3) => {
                let delay = 1000;
                for (let i = 0; i < maxRetries; i++) {
                    try {
                        const response = await fetch(url, options);
                        if (!response.ok) {
                            if (response.status === 429) {
                                throw new Error('Rate limited');
                            }
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return await response.json();
                    } catch (error) {
                        if (i === maxRetries - 1) throw error;
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                    }
                }
            };

            const generateContent = async () => {
                if (!topic.trim()) {
                    setErrorMsg('Silakan masukkan topik terlebih dahulu.');
                    return;
                }

                setLoading(true);
                setErrorMsg('');
                setGeneratedData(null);
                setStatus('AI sedang menyusun ide dan mendesain gambar... (Tunggu sekitar 15-30 detik)');

                try {
                    // Kita memanggil Backend Vercel milik kita sendiri!
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        // Kita kirimkan data dan password ke backend
                        body: JSON.stringify({ 
                            topic: topic, 
                            numSlides: numSlides, 
                            platform: platform, 
                            aspectRatio: aspectRatio,
                            password: password // Kirim password yang diketik user
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Terjadi kesalahan pada server.');
                    }

                    setGeneratedData(data);
                    setStatus('Selesai!');

                } catch (error) {
                    console.error("Generation error:", error);
                    setErrorMsg(error.message);
                } finally {
                    setLoading(false);
                }
            };


            const copyToClipboard = () => {
                const textToCopy = `${generatedData?.caption}\n\n${generatedData?.hashtags}`;
                try {
                    // Create temporary textarea for iframe compatibility
                    const textarea = document.createElement('textarea');
                    textarea.value = textToCopy;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (err) {
                    console.error('Failed to copy text: ', err);
                }
            };

            const handleSlideChange = (index, field, value) => {
                const newData = { ...generatedData };
                newData.slides[index][field] = value;
                setGeneratedData(newData);
            };

            const regenerateSingleImage = async (index) => {
                setSlideLoading(prev => ({ ...prev, [index]: true }));
                const slide = generatedData.slides[index];
                const apiKey = ""; // Provided by Canvas runtime

                const isCover = index === 0;
                const extraStyle = isCover ? "Make it an extremely eye-catching COVER SLIDE with bold, huge typography, high contrast, and curiosity-inducing vibe." : "Professional layout like an instagram infographic or motivational quote post.";

                const imagePrompt = `Create a carousel slide design (aspect ratio ${generatedData.ratio}) for ${generatedData.platform}. 
                Visual background: ${slide.visualPrompt}.
                Style: Modern, inspiring, highly aesthetic, cinematic lighting, ${extraStyle}
                
                CRITICAL INSTRUCTION - You MUST write the following exact text on the image with beautiful, readable typography:
                Headline Text to write (Large font): "${slide.headline}"
                Subtext to write (Smaller font, placed below headline): "${slide.subtext}"
                Page indicator text to write (Small font, top left corner): "${slide.slideNumber}/${numSlides}"
                
                Ensure there is good contrast, use a dark gradient overlay or shadow behind the text so it is clearly readable against the background. DO NOT USE PLACEHOLDER TEXT, write exactly what is provided.`;

                const imagePayload = {
                    contents: [{ role: 'user', parts: [{ text: imagePrompt }] }],
                    generationConfig: { responseModalities: ['IMAGE'], imageConfig: { aspectRatio: generatedData.ratio } },
                };

                const imageUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;

                try {
                    const imgResult = await fetchWithRetry(imageUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(imagePayload)
                    });

                    const base64Data = imgResult?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    const mimeType = imgResult?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.mimeType || 'image/jpeg';
                    
                    if (base64Data) {
                        const newData = { ...generatedData };
                        newData.slides[index].imgSrc = `data:${mimeType};base64,${base64Data}`;
                        setGeneratedData(newData);
                    } else {
                        setErrorMsg("Gagal memproses gambar baru untuk slide " + (index + 1));
                    }
                } catch (err) {
                    console.error("Error generating image", err);
                    setErrorMsg("Terjadi kesalahan saat generate ulang gambar.");
                } finally {
                    setSlideLoading(prev => ({ ...prev, [index]: false }));
                }
            };

            const downloadImage = (imgSrc, slideNumber) => {
                // Perbaikan untuk mobile: Konversi base64 ke Blob Object URL agar lebih stabil saat diunduh
                fetch(imgSrc)
                    .then(res => res.blob())
                    .then(blob => {
                        const blobUrl = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = blobUrl;
                        link.download = `slide-${slideNumber}.jpg`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
                    })
                    .catch(err => {
                        console.error('Download error:', err);
                        // Fallback jika fetch blob gagal di browser lama
                        const link = document.createElement('a');
                        link.href = imgSrc;
                        link.download = `slide-${slideNumber}.jpg`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    });
            };

            const downloadAllImages = async () => {
                if (!generatedData || !generatedData.slides || typeof JSZip === 'undefined') return;
                
                setIsDownloadingAll(true);
                try {
                    const zip = new JSZip();
                    const folderName = topic ? topic.replace(/[^a-z0-9]/gi, '_').toLowerCase() : 'carousel';
                    
                    // Menambahkan setiap gambar ke dalam file zip
                    generatedData.slides.forEach((slide) => {
                        // Pastikan imgSrc adalah base64 string
                        if (slide.imgSrc && slide.imgSrc.startsWith('data:image')) {
                            const base64Data = slide.imgSrc.split(',')[1];
                            zip.file(`slide-${slide.slideNumber}.jpg`, base64Data, {base64: true});
                        }
                    });

                    // Generate file zip dan unduh
                    const content = await zip.generateAsync({type: "blob"});
                    const blobUrl = URL.createObjectURL(content);
                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = `${folderName}_all_slides.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
                } catch (error) {
                    console.error("Gagal membuat file zip:", error);
                    setErrorMsg("Gagal mengunduh semua file, pastikan gambar sudah ter-generate sempurna.");
                } finally {
                    setIsDownloadingAll(false);
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === 'DESIGN') {
                    setIsAuthenticated(true);
                    setLoginError('');
                } else {
                    setLoginError('Password yang Anda masukkan salah!');
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 w-full max-w-md animate-fade-in-up">
                            <div className="text-center mb-8">
                                <div className="bg-blue-600 w-14 h-14 rounded-xl text-white flex items-center justify-center mx-auto mb-5 text-2xl shadow-md">
                                    <i className="fa-solid fa-lock"></i>
                                </div>
                                <h2 className="text-2xl font-bold text-gray-900">Akses Terkunci</h2>
                                <p className="text-gray-500 mt-2 text-sm">Silakan masukkan password untuk menggunakan AutoCarousel AI.</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <input 
                                        type="password" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-center tracking-[0.3em] font-medium"
                                        placeholder="••••••"
                                        autoFocus
                                    />
                                </div>
                                {loginError && (
                                    <div className="p-3 bg-red-50 text-red-600 text-sm text-center rounded-lg border border-red-100 font-medium">
                                        <i className="fa-solid fa-triangle-exclamation mr-1"></i> {loginError}
                                    </div>
                                )}
                                <button 
                                    type="submit"
                                    className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold transition-all shadow-md active:scale-95 flex justify-center items-center gap-2"
                                >
                                    Buka Akses <i className="fa-solid fa-arrow-right-to-bracket ml-1"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 pb-12">
                    {/* Navbar */}
                    <nav className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="bg-blue-600 p-2 rounded-lg text-white">
                                    <i className="fa-solid fa-layer-group"></i>
                                </div>
                                <h1 className="text-xl font-bold text-gray-900 tracking-tight">AutoCarousel AI</h1>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
                        {/* Input Section */}
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8 mb-8">
                            <h2 className="text-lg font-semibold text-gray-800 mb-4">Mulai Buat Carousel Kamu</h2>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-6">
                                <div className="md:col-span-3 lg:col-span-3">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Topik Konten (contoh: "Kunci Sukses Dunia dan Akhirat")
                                    </label>
                                    <input 
                                        type="text" 
                                        value={topic}
                                        onChange={(e) => setTopic(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                        placeholder="Ketik topik carousel di sini..."
                                        disabled={loading}
                                    />
                                </div>
                                
                                <div className="md:col-span-1 lg:col-span-1">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Platform Target
                                    </label>
                                    <select 
                                        value={platform}
                                        onChange={(e) => setPlatform(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                        disabled={loading}
                                    >
                                        <option value="Instagram">Instagram</option>
                                        <option value="TikTok">TikTok</option>
                                        <option value="Facebook">Facebook</option>
                                        <option value="LinkedIn">LinkedIn</option>
                                    </select>
                                </div>

                                <div className="md:col-span-1 lg:col-span-1">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Rasio Gambar
                                    </label>
                                    <select 
                                        value={aspectRatio}
                                        onChange={(e) => setAspectRatio(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                        disabled={loading}
                                    >
                                        <option value="9:16">9:16 (Story/Reels)</option>
                                        <option value="1:1">1:1 (Square)</option>
                                        <option value="4:5">4:5 (Portrait)</option>
                                        <option value="16:9">16:9 (Landscape)</option>
                                    </select>
                                </div>

                                <div className="md:col-span-1 lg:col-span-1">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Jumlah Slide
                                    </label>
                                    <select 
                                        value={numSlides}
                                        onChange={(e) => setNumSlides(parseInt(e.target.value))}
                                        className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                        disabled={loading}
                                    >
                                        {[2,3,4,5,6,7].map(num => (
                                            <option key={num} value={num}>{num} Slide</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {errorMsg && (
                                <div className="mt-4 p-4 bg-red-50 text-red-700 rounded-lg text-sm border border-red-100">
                                    <i className="fa-solid fa-triangle-exclamation mr-2"></i>
                                    {errorMsg}
                                </div>
                            )}

                            <div className="mt-6 flex items-center justify-between">
                                <div className="flex items-center text-gray-500 text-sm">
                                    {loading && (
                                        <>
                                            <div className="loader mr-3"></div>
                                            <span className="font-medium animate-pulse">{status}</span>
                                        </>
                                    )}
                                </div>
                                <button 
                                    onClick={generateContent}
                                    disabled={loading || !topic.trim()}
                                    className={`px-6 py-3 rounded-xl font-semibold text-white transition-all shadow-md
                                        ${loading || !topic.trim() ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 hover:shadow-lg active:scale-95'}
                                    `}
                                >
                                    <i className="fa-solid fa-wand-magic-sparkles mr-2"></i>
                                    Generate Sekarang
                                </button>
                            </div>
                        </div>

                        {/* Output Section */}
                        {generatedData && !loading && (
                            <div className="space-y-8 animate-fade-in-up">
                                
                                {/* Carousel Preview & Editor */}
                                <div>
                                    <div className="flex items-center justify-between mb-4">
                                        <div>
                                            <h3 className="text-xl font-bold text-gray-800">Preview & Edit Carousel</h3>
                                            <span className="text-sm text-gray-500"><i className="fa-solid fa-pen mr-1"></i> Sesuaikan teks & gambar</span>
                                        </div>
                                        <button 
                                            onClick={downloadAllImages}
                                            disabled={isDownloadingAll}
                                            className="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-semibold transition-all shadow-md active:scale-95 flex items-center"
                                        >
                                            {isDownloadingAll ? (
                                                <><i className="fa-solid fa-spinner fa-spin mr-2"></i>Memproses ZIP...</>
                                            ) : (
                                                <><i className="fa-solid fa-file-zipper mr-2"></i>Unduh Semua (ZIP)</>
                                            )}
                                        </button>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-4">
                                        {generatedData.slides.map((slide, idx) => (
                                            <div key={idx} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col relative">
                                                {/* Image Preview */}
                                                <div 
                                                    className="relative bg-gray-100 w-full group"
                                                    style={{ aspectRatio: generatedData.ratio ? generatedData.ratio.replace(':', '/') : '9/16' }}
                                                >
                                                    {slideLoading[idx] && (
                                                        <div className="absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center">
                                                            <div className="loader mb-2"></div>
                                                            <span className="text-sm font-medium text-gray-600">Generating...</span>
                                                        </div>
                                                    )}
                                                    <img src={slide.imgSrc} alt={`Slide ${idx + 1}`} loading="lazy" className="w-full h-full object-cover"/>
                                                    
                                                    {/* Hover Overlay */}
                                                    <div className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center gap-4">
                                                        <button 
                                                            onClick={() => downloadImage(slide.imgSrc, slide.slideNumber)}
                                                            className="p-3 bg-white hover:bg-gray-100 rounded-full text-gray-800 shadow-lg transition-all transform hover:scale-110"
                                                            title="Download Gambar"
                                                        >
                                                            <i className="fa-solid fa-download"></i>
                                                        </button>
                                                        <button 
                                                            onClick={() => regenerateSingleImage(idx)}
                                                            disabled={slideLoading[idx]}
                                                            className="p-3 bg-blue-600 hover:bg-blue-700 rounded-full text-white shadow-lg transition-all transform hover:scale-110"
                                                            title="Regenerate Gambar"
                                                        >
                                                            <i className="fa-solid fa-rotate-right"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                                
                                                {/* Editor Form */}
                                                <div className="p-4 space-y-3 flex-1 flex flex-col bg-gray-50 border-t border-gray-100">
                                                    <div className="flex justify-between items-center mb-1">
                                                        <span className="text-xs font-bold bg-blue-100 text-blue-800 px-2 py-1 rounded">Slide {slide.slideNumber}</span>
                                                    </div>
                                                    
                                                    <div>
                                                        <label className="block text-xs font-medium text-gray-500 mb-1">Headline</label>
                                                        <input 
                                                            type="text" 
                                                            value={slide.headline}
                                                            onChange={(e) => handleSlideChange(idx, 'headline', e.target.value)}
                                                            className="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none"
                                                        />
                                                    </div>
                                                    
                                                    <div>
                                                        <label className="block text-xs font-medium text-gray-500 mb-1">Subtext</label>
                                                        <textarea 
                                                            value={slide.subtext}
                                                            onChange={(e) => handleSlideChange(idx, 'subtext', e.target.value)}
                                                            rows="2"
                                                            className="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none"
                                                        ></textarea>
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-medium text-gray-500 mb-1">Visual Prompt Background</label>
                                                        <textarea 
                                                            value={slide.visualPrompt}
                                                            onChange={(e) => handleSlideChange(idx, 'visualPrompt', e.target.value)}
                                                            rows="2"
                                                            className="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none text-gray-600"
                                                        ></textarea>
                                                    </div>
                                                    
                                                    <div className="pt-2 mt-auto">
                                                        <button 
                                                            onClick={() => regenerateSingleImage(idx)}
                                                            disabled={slideLoading[idx]}
                                                            className="w-full py-2 bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 text-sm font-medium rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm"
                                                        >
                                                            {slideLoading[idx] ? (
                                                                <><i className="fa-solid fa-spinner fa-spin"></i> Memproses...</>
                                                            ) : (
                                                                <><i className="fa-solid fa-rotate-right"></i> Generate Gambar Baru</>
                                                            )}
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Caption & Hashtags */}
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-xl font-bold text-gray-800">Caption & Hashtags</h3>
                                        <button 
                                            onClick={copyToClipboard}
                                            className="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition-colors flex items-center"
                                        >
                                            {copied ? (
                                                <><i className="fa-solid fa-check text-green-500 mr-2"></i>Tersalin!</>
                                            ) : (
                                                <><i className="fa-regular fa-copy mr-2"></i>Salin Teks</>
                                            )}
                                        </button>
                                    </div>
                                    <div className="bg-gray-50 rounded-xl p-5 border border-gray-200">
                                        <p className="whitespace-pre-wrap text-gray-700 text-sm leading-relaxed mb-4">
                                            {generatedData.caption}
                                        </p>
                                        <p className="text-blue-600 font-medium text-sm">
                                            {generatedData.hashtags}
                                        </p>
                                    </div>
                                </div>

                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
